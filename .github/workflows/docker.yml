name: Build and publish container
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to Quay.io"
        type: boolean
        default: false
      latest:
        description: "Also tag image as latest"
        type: boolean
        default: false
jobs:
  build-container:
      runs-on: ubuntu-latest
      env:
        REGISTRY: quay.io
        IMAGE_NAME: rosalindfranklininstitute/volume-segmantics
      steps:
        - uses: actions/checkout@v6
        - name: Log in to Quay.io
          if: github.event_name == 'release' || inputs.push == true
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ secrets.QUAY_USERNAME }}
            password: ${{ secrets.QUAY_PASSWORD }}
        - name: Extract image metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            tags: |
              type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.latest == true }}
              type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
              type=sha,format=short
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Build container (and push if release or requested)
          uses: docker/build-push-action@v6
          with:
            context: .
            outputs: ${{ (github.event_name == 'release' || inputs.push == true) && 'type=docker,type=registry' || 'type=docker' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
